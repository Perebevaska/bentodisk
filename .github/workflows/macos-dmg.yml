name: Build macOS DMG

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Run offline tests
        run: /usr/bin/python3 -B -m unittest discover -s tests
      - name: Build, mount and verify universal DMG
        run: bash packaging/build-dmg.sh
      - name: Upload verified disk image
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: BentoDisk-macOS
          path: dist/BentoDisk-macOS.dmg
          if-no-files-found: error
          compression-level: 0
