name: Build macOS DMG

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      notarize:
        description: Sign with Developer ID and submit the DMG to Apple
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 120
    env:
      NOTARIZE: ${{ inputs.notarize == true || (github.ref_type == 'tag' && vars.BENTODISK_NOTARIZE_RELEASES == 'true') }}
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Run offline tests
        run: /usr/bin/python3 -B -m unittest discover -s tests
      - name: Fetch and verify pinned Sparkle SDK
        run: |
          bash packaging/fetch-sparkle.sh "$RUNNER_TEMP/sparkle"
          echo "SPARKLE_SDK=$RUNNER_TEMP/sparkle" >> "$GITHUB_ENV"
      - name: Build, mount and verify universal DMG
        if: env.NOTARIZE != 'true'
        run: bash packaging/build-dmg.sh
      - name: Sign with Developer ID, notarize and verify DMG
        if: env.NOTARIZE == 'true'
        env:
          DEVELOPER_ID_P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: bash packaging/notarize-dmg.sh
      - name: Upload verified disk image
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ${{ env.NOTARIZE == 'true' && 'BentoDisk-macOS-notarized' || 'BentoDisk-macOS' }}
          path: dist/BentoDisk-macOS.dmg
          if-no-files-found: error
          compression-level: 0
      - name: Sign private update and feed
        if: github.ref_type == 'tag'
        env:
          BENTODISK_SPARKLE_PRIVATE_KEY: ${{ secrets.BENTODISK_SPARKLE_PRIVATE_KEY }}
        run: bash packaging/sign-update.sh
      - name: Upload private test channel
        if: github.ref_type == 'tag'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: BentoDisk-private-updates
          path: dist/channel/
          if-no-files-found: error
          compression-level: 0
